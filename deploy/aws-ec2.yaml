AWSTemplateFormatVersion: '2010-09-09'
Description: Book recommender Docker deployment on Amazon EC2 with persistent EBS storage.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC containing the chosen public subnet.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with an Internet Gateway route.
  AllowedCidr:
    Type: String
    Description: Your public IPv4 address followed by /32. Do not use 0.0.0.0/0.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/(3[0-2]|[12][0-9]|[1-9])'
    ConstraintDescription: Supply an IPv4 CIDR with a prefix from 1 to 32.
  KeyParameterName:
    Type: String
    Default: /book-recommender/openai-api-key
    AllowedPattern: '/[a-zA-Z0-9_.\-/]+'
    Description: Existing SSM SecureString using the default aws/ssm KMS key, in this region.
  CodeCommit:
    Type: String
    AllowedPattern: '[a-f0-9]{40}'
    Description: Full Git commit SHA containing this Dockerfile. Pin a reviewed revision.
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3a.small, t3a.medium]
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Restricted book recommender access; administration uses SSM.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 7860
          ToPort: 7860
          CidrIp: !Ref AllowedCidr
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadRecommenderKey
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${KeyParameterName}
              - Effect: Deny
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                NotResource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${KeyParameterName}
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: book-recommender
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          umask 077
          dnf install -y docker unzip
          systemctl enable --now docker
          if ! command -v aws >/dev/null; then
            curl --fail --silent --show-error --location https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install
          fi
          mkdir -p /opt/book-recommender
          cd /opt/book-recommender
          curl --fail --silent --show-error --location https://codeload.github.com/setsam37/BookRecommenderSemantic/tar.gz/${CodeCommit} -o source.tar.gz
          mkdir source
          tar -xzf source.tar.gz --strip-components=1 -C source
          OPENAI_KEY=$(aws ssm get-parameter --name '${KeyParameterName}' --with-decryption --region '${AWS::Region}' --query Parameter.Value --output text)
          test -n "$OPENAI_KEY"
          test "$OPENAI_KEY" != None
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_KEY" > .env
          unset OPENAI_KEY
          printf 'OPENAI_EMBEDDING_MODEL=text-embedding-3-small\n' >> .env
          docker build --tag book-recommender:${CodeCommit} source
          docker volume create book-index
          docker run --detach --name book-recommender --restart unless-stopped \
            --publish 7860:7860 --env-file .env \
            --mount source=book-index,target=/app/.cache/chroma \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --log-opt max-size=10m --log-opt max-file=3 \
            book-recommender:${CodeCommit}
Outputs:
  Service:
    Description: AWS service used for this project.
    Value: Amazon EC2
  InstanceId:
    Value: !Ref Instance
  AppUrl:
    Description: HTTP demo URL, reachable only from AllowedCidr after bootstrap completes.
    Value: !Sub http://${Instance.PublicIp}:7860
